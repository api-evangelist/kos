aid: kos
name: Kos
description: 'Kos (Kosai, Inc.) builds what it calls the world''s first virtual finance
  employee: an AI agent given its own workstation, org identity, software licenses,
  RBAC and audit logs, which completes finance and back-office workflows for capital-
  and inventory-heavy operators across datacenters, defense, energy, long-lead equipment,
  space and contracting. Kos reviews pay applications and vendor invoices line-by-line
  against GMP contracts, catching missing backup, overbills and calculation errors;
  generates, routes and closes out purchase orders inside a customer''s ERP; and is
  taught new workflows over screenshare like a new hire. It is reached over email,
  Slack, Teams, phone and Zoom rather than through a UI, app or public API. Founded
  by Tanuj and Mani, who met as graduate researchers at Stanford under Sachin Katti;
  backed by 8VC, XYZ Ventures, MVP Ventures and Launch, with advisors including former
  Equinix CFO Keith Taylor. Headquartered in San Francisco, California.'
